{{define "content"}}
<div class="auth">
  <div class="auth-head">
    {{template "logo"}}
    <h1>Log in to Skiff</h1>
    <p>Manage the sites on this server.</p>
  </div>
  {{with .Data.Error}}{{template "flash" (dict "Kind" "err" "Msg" .)}}{{end}}
  <form method="post" action="/login" class="card">
    <div class="card-body stack">
      <label>Username
        <input name="username" value="{{.Data.Username}}" required autocomplete="username" autofocus>
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button class="btn primary">Continue</button>
    </div>
  </form>
  <p class="hint auth-foot">Forgot it? Run <code>sudo skiff reset-admin</code> on the server.</p>
</div>
{{end}}

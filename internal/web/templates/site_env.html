{{define "content"}}
{{$d := .Data}}
<div class="page-head">
  <div>
    <h1>Environment</h1>
    <p class="page-sub">The <code>.env</code> file of <strong>{{$d.Site.Domain}}</strong>, read live from the server.</p>
  </div>
</div>
{{with $d.Error}}{{template "flash" (dict "Kind" "err" "Msg" .)}}{{end}}
<form method="post" action="/sites/{{$d.Site.ID}}/env" class="card">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <div class="card-body">
    <textarea name="env" class="code" rows="26" spellcheck="false" aria-label=".env contents">{{$d.Env}}</textarea>
  </div>
  <div class="card-footer">
    <span>Saved atomically. If the app caches config, <code>php artisan config:cache</code> runs afterwards.</span>
    <div class="actions">
      <a class="btn ghost" href="/sites/{{$d.Site.ID}}">Cancel</a>
      <button class="btn primary">Save</button>
    </div>
  </div>
</form>
{{end}}
